name: Test
on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build
        run: mvn -B -q -DskipTests package
      - name: Test
        run: mvn -B test
      - name: Smoke-test the yup command
        run: |
          echo '{"op":"isValid","schema":["string",["min",2]],"value":"ab"}' | bin/yup | grep -qx '{"result":true}'
